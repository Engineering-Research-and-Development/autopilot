name: packageline3

x-cors: &cors
  BASYX_CORS_ALLOWED_ORIGINS: "*"
  BASYX_CORS_ALLOWED_METHODS: GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD

services:
  mongo:
    image: mongo:9.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoAdmin
      MONGO_INITDB_ROOT_PASSWORD: mongoPassword
    volumes:
      - mongo-data:/data/db
    restart: always
    healthcheck:
      test: mongosh --quiet --eval 'db.runCommand({ping:1})'
      interval: 10s
      timeout: 5s
      retries: 10

  aas-env:
    image: eclipsebasyx/aas-environment:2.0.0-milestone-16
    environment:
      <<: *cors
      SERVER_PORT: 8081
      BASYX_BACKEND: MongoDB
      SPRING_MONGODB_URI: mongodb://mongoAdmin:mongoPassword@mongo:27017/aas-env?authSource=admin
      BASYX_ENVIRONMENT: file:aas
      BASYX_EXTERNALURL: http://localhost:8081
      BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION: http://aas-registry:8080
      BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION: http://sm-registry:8080
      SPRING_SERVLET_MULTIPART_MAXFILESIZE: 500MB
      SPRING_SERVLET_MULTIPART_MAXREQUESTSIZE: 500MB
    volumes:
      - ./docker/aas:/application/aas:ro
    ports:
      - "8081:8081"
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
      aas-registry:
        condition: service_healthy
      sm-registry:
        condition: service_healthy

  aas-registry:
    image: eclipsebasyx/aas-registry-log-mongodb:2.0.0-milestone-16
    environment:
      <<: *cors
      SERVER_PORT: 8080
      SPRING_MONGODB_URI: mongodb://mongoAdmin:mongoPassword@mongo:27017/aasregistry?authSource=admin
    ports:
      - "8082:8080"
    restart: always
    depends_on:
      mongo:
        condition: service_healthy

  sm-registry:
    image: eclipsebasyx/submodel-registry-log-mongodb:2.0.0-milestone-16
    environment:
      <<: *cors
      SERVER_PORT: 8080
      SPRING_MONGODB_URI: mongodb://mongoAdmin:mongoPassword@mongo:27017/submodelregistry?authSource=admin
    ports:
      - "8083:8080"
    restart: always
    depends_on:
      mongo:
        condition: service_healthy

  aas-discovery:
    image: eclipsebasyx/aas-discovery:2.0.0-milestone-16
    environment:
      <<: *cors
      SERVER_PORT: 8081
      BASYX_BACKEND: MongoDB
      SPRING_MONGODB_URI: mongodb://mongoAdmin:mongoPassword@mongo:27017/aas-discovery?authSource=admin
    ports:
      - "8084:8081"
    restart: always
    depends_on:
      mongo:
        condition: service_healthy

  discovery-init:
    image: python:3.13-alpine
    configs:
      - source: register-discovery
        target: /register_discovery.py
    command: python /register_discovery.py
    depends_on:
      aas-env:
        condition: service_healthy
      aas-discovery:
        condition: service_healthy
    restart: "no"

  aas-web-ui:
    image: eclipsebasyx/aas-gui:v2-261013
    environment:
      AAS_REGISTRY_PATH: http://localhost:8082/shell-descriptors
      SUBMODEL_REGISTRY_PATH: http://localhost:8083/submodel-descriptors
      AAS_REPO_PATH: http://localhost:8081/shells
      SUBMODEL_REPO_PATH: http://localhost:8081/submodels
      CD_REPO_PATH: http://localhost:8081/concept-descriptions
      AAS_DISCOVERY_PATH: http://localhost:8084/lookup/shells
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      aas-env:
        condition: service_healthy

  zookeeper:
    image: apachepulsar/pulsar:4.1.2
    restart: on-failure
    volumes:
      - zookeeper-data:/pulsar/data
    environment:
      - metadataStoreUrl=zk:zookeeper:2181
      - PULSAR_MEM=-Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m
    command:
      - bash
      - -c
      - |
        bin/apply-config-from-env.py conf/zookeeper.conf && \
        bin/generate-zookeeper-config.sh conf/zookeeper.conf && \
        exec bin/pulsar zookeeper
    healthcheck:
      test: ["CMD", "bin/pulsar-zookeeper-ruok.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  pulsar-init:
    image: apachepulsar/pulsar:4.1.2
    command:
      - bash
      - -c
      - |
        bin/pulsar initialize-cluster-metadata \
        --cluster pulsar-cluster \
        --zookeeper zookeeper:2181 \
        --configuration-store zookeeper:2181 \
        --web-service-url http://broker:9553 \
        --broker-service-url pulsar://broker:6650
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: "no"

  bookie:
    image: apachepulsar/pulsar:4.1.2
    restart: on-failure
    environment:
      - clusterName=pulsar-cluster
      - zkServers=zookeeper:2181
      - metadataServiceUri=metadata-store:zk:zookeeper:2181
      - advertisedAddress=bookie
      - BOOKIE_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    volumes:
      - bookkeeper-data:/pulsar/data
    command: bash -c "bin/apply-config-from-env.py conf/bookkeeper.conf && exec bin/pulsar bookie"
    depends_on:
      zookeeper:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully

  broker:
    image: apachepulsar/pulsar:4.1.2
    hostname: broker
    restart: on-failure
    ports:
      - "6650:6650"
      - "9553:9553"
    volumes:
      - ./docker/pulsar/client.conf:/pulsar/conf/client.conf:ro
    environment:
      - metadataStoreUrl=zk:zookeeper:2181
      - zookeeperServers=zookeeper:2181
      - clusterName=pulsar-cluster
      - managedLedgerDefaultEnsembleSize=1
      - managedLedgerDefaultWriteQuorum=1
      - managedLedgerDefaultAckQuorum=1
      - functionsWorkerEnabled=true
      - webServicePort=9553
      - advertisedAddress=broker
      - PULSAR_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    command: bash -c "bin/apply-config-from-env.py conf/broker.conf && exec bin/pulsar broker"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9553/admin/v2/brokers/health"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30
    depends_on:
      zookeeper:
        condition: service_healthy
      bookie:
        condition: service_started

  pulsar-function:
    build:
      context: ./docker/pulsar-function
      dockerfile_inline: |
        FROM golang:1.25-alpine AS build
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
        COPY basyxupdater.go ./
        RUN CGO_ENABLED=0 go build -o /out/basyxupdater basyxupdater.go

        FROM apachepulsar/pulsar:4.1.2
        COPY --from=build /out/basyxupdater /pulsar/function/basyxupdater
        COPY function-config.yaml /pulsar/function/function-config.yaml
    image: packageline3/basyxupdater:c67d76d
    command:
      - bash
      - -c
      - |
        admin="bin/pulsar-admin --admin-url http://broker:9553"
        fn="--tenant public --namespace default --name basyxupdater"
        until $$admin functions list --tenant public --namespace default >/dev/null 2>&1; do
          echo "waiting for the Pulsar functions worker..."; sleep 5
        done
        if $$admin functions get $$fn >/dev/null 2>&1; then
          $$admin functions delete $$fn || exit 1
        fi
        $$admin functions create --go /pulsar/function/basyxupdater \
          --function-config-file /pulsar/function/function-config.yaml || exit 1
        for i in $$(seq 1 60); do
          if $$admin functions status $$fn | grep -Eq '"running" ?: ?true'; then echo "basyxupdater is running"; exit 0; fi
          echo "waiting for basyxupdater to start..."; sleep 5
        done
        $$admin functions status $$fn; exit 1
    depends_on:
      broker:
        condition: service_healthy
      aas-env:
        condition: service_healthy
    restart: "no"

  dekaf:
    image: visortelle/dekaf:1.1.0
    restart: unless-stopped
    environment:
      DEKAF_PULSAR_WEB_URL: "http://broker:9553"
      DEKAF_PULSAR_BROKER_URL: "pulsar://broker:6650"
    ports:
      - "8090:8090"
    depends_on:
      broker:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    hostname: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  pss-pass-broker:
    build:
      context: https://github.com/Engineering-Research-and-Development/pss-pass-broker.git#c67d76dd6685d12e52ac0153d8de6cd674b2f8e9
    image: packageline3/pss-pass-broker:c67d76d
    restart: unless-stopped
    volumes:
      - ./docker/broker/config.yaml:/app/src/config.yaml:ro
    depends_on:
      broker:
        condition: service_healthy
      mosquitto:
        condition: service_started

configs:
  register-discovery:
    content: |
      import base64, json, sys, urllib.error, urllib.request

      REPO = "http://aas-env:8081"
      DISCOVERY = "http://aas-discovery:8081/lookup/shells"


      def b64(s):
          return base64.urlsafe_b64encode(s.encode()).decode().rstrip("=")


      def call(method, url, body=None):
          data = json.dumps(body).encode() if body is not None else None
          req = urllib.request.Request(url, data, {"Content-Type": "application/json"}, method=method)
          try:
              with urllib.request.urlopen(req) as r:
                  return r.status, r.read()
          except urllib.error.HTTPError as e:
              return e.code, e.read()


      def shells():
          cursor = ""
          while True:
              status, body = call("GET", f"{REPO}/shells?limit=100" + (f"&cursor={cursor}" if cursor else ""))
              if status != 200:
                  sys.exit(f"Cannot list shells: HTTP {status}")
              page = json.loads(body)
              yield from page["result"]
              cursor = (page.get("paging_metadata") or {}).get("cursor")
              if not cursor:
                  return


      failed = 0
      for shell in shells():
          info = shell["assetInformation"]
          links = [{"name": "globalAssetId", "value": info["globalAssetId"]}] if info.get("globalAssetId") else []
          links += [{"name": x["name"], "value": x["value"]} for x in info.get("specificAssetIds", [])]
          if not links:
              continue
          url = f"{DISCOVERY}/{b64(shell['id'])}"
          call("DELETE", url)
          status, _ = call("POST", url, links)
          code, body = call("GET", f"{DISCOVERY}?assetIds={b64(json.dumps(links[0]))}")
          ok = status == 201 and code == 200 and shell["id"] in json.loads(body)["result"]
          failed += not ok
          print(f"{shell['idShort']:22} {'OK' if ok else 'FAILED'}")
      sys.exit(1 if failed else 0)

networks:
  default:
    name: packageline3-net

volumes:
  mongo-data:
  zookeeper-data:
  bookkeeper-data:
  mosquitto-data:
