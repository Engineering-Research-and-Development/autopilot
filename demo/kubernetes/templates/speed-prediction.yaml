apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avant-node-red.fullname" . }}-speed-prediction
  labels:
    {{- include "avant-node-red.labels" . | nindent 4 }}
    app.kubernetes.io/component: speed-prediction
spec:
  replicas: {{ .Values.speedPrediction.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: speed-prediction
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: speed-prediction
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: speed-prediction
          image: "{{ .Values.speedPrediction.image.repository }}:{{ .Values.speedPrediction.image.tag }}"
          imagePullPolicy: {{ .Values.speedPrediction.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8010
              protocol: TCP
          securityContext:
            {{- toYaml .Values.speedPrediction.securityContext | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          {{- if .Values.speedPrediction.resources }}
          resources:
            {{- toYaml .Values.speedPrediction.resources | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "avant-node-red.fullname" . }}-speed-prediction
  labels:
    {{- include "avant-node-red.labels" . | nindent 4 }}
    app.kubernetes.io/component: speed-prediction
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: speed-prediction
  ports:
    - name: http
      port: {{ .Values.speedPrediction.service.port }}
      targetPort: http
      protocol: TCP
