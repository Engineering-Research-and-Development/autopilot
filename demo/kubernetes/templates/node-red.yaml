apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avant-node-red.fullname" . }}-node-red
  labels:
    {{- include "avant-node-red.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-red
spec:
  replicas: {{ .Values.nodeRed.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: node-red
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: node-red
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-red
          image: "{{ .Values.nodeRed.image.repository }}:{{ .Values.nodeRed.image.tag }}"
          imagePullPolicy: {{ .Values.nodeRed.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 1880
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.nodeRed.timezone | quote }}
          securityContext:
            {{- toYaml .Values.nodeRed.securityContext | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- if .Values.nodeRed.resources }}
          resources:
            {{- toYaml .Values.nodeRed.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.nodeRed.persistence.enabled }}
          volumeMounts:
            - name: node-red-data
              mountPath: /data
          {{- end }}
      {{- if .Values.nodeRed.persistence.enabled }}
      volumes:
        - name: node-red-data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-nodered-data" (include "avant-node-red.fullname" .)) .Values.nodeRed.persistence.existingClaim }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "avant-node-red.fullname" . }}-node-red
  labels:
    {{- include "avant-node-red.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-red
spec:
  type: {{ .Values.nodeRed.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: node-red
  ports:
    - name: http
      port: {{ .Values.nodeRed.service.port }}
      targetPort: http
      protocol: TCP
